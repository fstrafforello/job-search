# Pushing a version tag (npm run release:patch / release:minor) builds the Windows exe
# and the Mac app, and publishes them as a GitHub Release. Installed apps pick it up through the in-app updater.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history and tags, for the release notes

      - uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Check tag matches package.json version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1
          fi

      - run: npm ci

      - run: npm test

      # The Google sign-in client for Drive sync comes from the repository's Actions secrets.
      - run: npm run build:exe
        env:
          JSD_GOOGLE_CLIENT_ID: ${{ secrets.JSD_GOOGLE_CLIENT_ID }}
          JSD_GOOGLE_CLIENT_SECRET: ${{ secrets.JSD_GOOGLE_CLIENT_SECRET }}

      # Written here rather than with GitHub's generated notes, whose API has failed with server errors.
      - name: Write release notes
        shell: bash
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "## What's new"
            echo
            git log --no-merges --format='- %s' ${prev:+$prev..}$GITHUB_REF_NAME | grep -vE '^- v?[0-9]+\.[0-9]+\.[0-9]+$' || true
            echo
            echo "**Download:** JobSearchDashboard.exe below. Already installed? The app offers this update by itself."
          } > release-notes.md
          cat release-notes.md

      # Re-running is safe: an existing release for this tag is updated and the exe replaced.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/JobSearchDashboard.exe
          body_path: release-notes.md
          fail_on_unmatched_files: true

  # The Apple Silicon Mac app, added to the release the Windows job just published.
  build-mac:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26

      - run: npm ci

      - run: npm test

      - run: npm run build:exe
        env:
          JSD_GOOGLE_CLIENT_ID: ${{ secrets.JSD_GOOGLE_CLIENT_ID }}
          JSD_GOOGLE_CLIENT_SECRET: ${{ secrets.JSD_GOOGLE_CLIENT_SECRET }}

      - name: Add the Mac app to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/JobSearchDashboard-macOS-arm64.zip
          fail_on_unmatched_files: true
