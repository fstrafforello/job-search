<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Search Dashboard</title>
  <link rel="icon" href="/icon-32.png" sizes="32x32">
  <link rel="icon" href="/icon-192.png" sizes="192x192">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><img class="brand-mark" src="/icon-192.png" alt="">Job Search<span class="version" id="app-version"></span></div>
      <nav>
        <a href="#/dashboard" data-nav="dashboard">Dashboard</a>
        <a href="#/jobs" data-nav="jobs">Jobs</a>
        <a href="#/assistant" data-nav="assistant">AI Assistant</a>
        <a href="#/profile" data-nav="profile">My Profile</a>
        <a href="#/settings" data-nav="settings">Settings</a>
      </nav>
      <a class="btn primary block" href="#/jobs/new">+ Add job</a>
      <div id="update-slot"></div>
      <section class="lm-panel compact" aria-label="LM Studio">
        <div class="lm-title"><span>LM Studio</span><a href="#/settings" class="small">Settings</a></div>
        <div id="lm-sidebar"></div>
      </section>
    </aside>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="tooltip" class="tooltip" hidden></div>
  <dialog id="dialog"></dialog>
  <div id="closed" class="closed" hidden>
    <div class="card"><h2>Job Search Dashboard has stopped</h2>
      <p class="muted">Open it again from its icon. Your data is saved.</p></div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
